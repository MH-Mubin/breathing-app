<!DOCTYPE html>

<meta charset="utf-8"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .breathing-bg {
            background: radial-gradient(circle at center, rgba(152, 242, 240, 0.15) 0%, rgba(247, 249, 251, 0) 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background font-body text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top Navigation Shell Suppressed for Transactional Screen -->
<header class="w-full h-16 flex items-center px-6 sticky top-0 bg-transparent z-10">
<div class="font-headline font-black text-2xl text-primary tracking-tight">Breathwork</div>
</header>
<main class="flex-grow flex flex-col items-center px-6 pb-12 breathing-bg">
<!-- Hero Illustration -->
<div class="w-full max-w-sm mb-10 flex justify-center mt-4">
<div class="relative w-full aspect-square rounded-full flex items-center justify-center max-w-[280px]">
<!-- Background visual "pulse" -->
<div class="absolute inset-0 bg-primary/5 rounded-full blur-3xl"></div>
<img alt="Mindful meditation illustration" class="relative z-10 w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0ujXlx1e5nDkwi73UsZnejc5jeU4123YXfQL8-KpU7obRHyyq03b8NmNJApL3WkPaAoHNjSuIkwezoxWkHpLgwr_s747zSETfrZ6uGX-anjdsu-g_Pfl9tPtTsqMCYJNPXhrHqN2MYQMWZrVlAWbt_rr7V2qzqHQSUX6rdKA-WIohN0s9lm8nqkqd2wyUtnAapaXvAXVQ9HbyZj2kCNeYoNF7c-YN-s4Xv_iZgm89HJ7e_eKYeL8i5O3Lub-8HIKoSKfM7B10y11Vw"/>
</div>
</div>
<!-- Content Area -->
<div class="w-full max-w-md">
<div class="mb-8">
<h1 class="font-headline text-4xl font-extrabold text-on-surface tracking-tight leading-tight">Welcome to Respira</h1>
<p class="text-on-surface-variant mt-3 font-medium">Your journey to mindful breathing starts here.</p>
</div>
<!-- Soft Card for Form -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_20px_40px_rgba(15,23,42,0.04)] mb-8">
<form class="space-y-5">
<div class="space-y-1.5">
<label class="text-[13px] font-bold text-on-surface-variant uppercase tracking-wider ml-1">Email Address</label>
<input class="w-full px-5 py-4 rounded-xl border-none bg-surface-container-low focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline transition-all" placeholder="name@example.com" type="email"/>
</div>
<div class="space-y-1.5">
<label class="text-[13px] font-bold text-on-surface-variant uppercase tracking-wider ml-1">Password</label>
<div class="relative">
<input class="w-full px-5 py-4 rounded-xl border-none bg-surface-container-low focus:ring-2 focus:ring-primary/20 text-on-surface placeholder:text-outline transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end pt-1">
<a class="text-primary font-bold text-sm hover:opacity-80" href="#">Forgot Password?</a>
</div>
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-container text-white font-bold rounded-xl shadow-lg shadow-primary/20 hover:scale-[0.98] active:scale-95 transition-all duration-200 mt-2" type="submit">
                        Continue
                    </button>
</form>
</div>
<!-- Divider -->
<div class="relative flex items-center gap-4 mb-8">
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
<span class="text-outline font-semibold text-xs uppercase tracking-widest">Or login with</span>
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 py-3.5 px-4 bg-surface-container-lowest rounded-xl border border-outline-variant/15 hover:bg-surface-container-low transition-colors group">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-bold text-on-surface text-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3.5 px-4 bg-surface-container-lowest rounded-xl border border-outline-variant/15 hover:bg-surface-container-low transition-colors group">
<svg class="w-5 h-5" fill="#0077B5" viewbox="0 0 24 24">
<path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"></path>
</svg>
<span class="font-bold text-on-surface text-sm">LinkedIn</span>
</button>
</div>
<!-- Footer Links -->
<div class="mt-12 text-center">
<p class="text-on-surface-variant font-medium">
                    New here? <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4" href="#">Create an account</a>
</p>
<p class="text-outline text-xs mt-8 px-8 leading-relaxed">
                    By continuing, you agree to our <a class="underline" href="#">Terms of Service</a> and <a class="underline" href="#">Privacy Policy</a>.
                </p>
</div>
</div>
</main>
<!-- BottomNavBar Suppressed for Transactional Screen (Login) -->
</body></html>
